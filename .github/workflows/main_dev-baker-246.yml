# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - app-dev-baker-246

on:
  push:
    branches:
      - main

permissions:
  id-token: write 
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: v1.${{ github.sha }}
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: pytest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4          

      - name: Construct image reference
        id: img
        run: echo "ref=${REGISTRY}/${IMAGE_NAME@L}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
  
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_GITHUB_OIDC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            
      - name: Point Web App at the GHCR image
        run: |
          az webapp config container set \
            --name ${{ secrets.PERSONAL_WEBSITE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.PERSONAL_WEBSITE_RG }} \
            --container-image-name "${{ steps.img.outputs.ref }}"
            
      - name: Restart Web App
        run: |
          az webapp restart \
            --name ${{ secrets.PERSONAL_WEBSITE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.PERSONAL_WEBSITE_RG }}       
