# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Personal website - Build and deploy Python app to Azure Web App

on:
  push:
    branches:
      - main
  pull_request:   
  
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}.${{ github.run_id }} # tag is version, commit sha and workflow run id
  WEBAPP_NAME: ${{ vars.PERSONAL_WEBSITE_WEBAPP_NAME }}
  WEBAPP_RESOURCEGROUP: ${{ vars.PERSONAL_WEBSITE_RG }} 
    
jobs:  
  lint-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
      - name: actionLint
        id: actionLint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
          
  test:
    needs: lint-workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: 
      contents: read
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: |
          pip install -r requirements-dev.txt
          pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest    
    timeout-minutes: 10
    permissions:      
      contents: read
      packages: write      
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true 
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:      
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1        
      
      - name: Construct image reference
        id: img
        run: echo "ref=${REGISTRY}/${IMAGE_NAME@L}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
      
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          load: true
          push: false
          tags: ${{ steps.img.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Scan image
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        id: push
        if: github.event_name != 'pull_request' # only push when deploying
        # Pushes image then grabs the digest
        # selects the manifest digest of the image | filters for only this registry | splits on '@' then takes the second field 
        # The second field in the sha of the digest
        run: | 
          name="${REGISTRY}/${IMAGE_NAME@L}"
          ref="${{ steps.img.outputs.ref }}"
          docker push "$ref"         
          digest=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$ref" |
            grep "^${name}@" | head -n1 | cut -d@ -f2) 
          : "${digest:?could not resolve digest after push}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed ${name}@${digest}"

      - name: Build summary
        if: always()
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Tag | \`${IMAGE_TAG}\` |"
            echo "| Scan | ${{ steps.scan.outcome }} |"
            echo "| Push | ${{ steps.push.outcome }} |"
            echo "| Digest | \`${DIGEST:-none}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          
  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest    
    timeout-minutes: 10
    permissions:      
      contents: read
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.ref }}
      cancel-in-progress: false      
    steps:
      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_GITHUB_OIDC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get current image
        id: webapp_img
        run: |
          current_image=$(az webapp config container show --name "$WEBAPP_NAME" --resource-group "$WEBAPP_RESOURCEGROUP" \
            --query "[?name=='DOCKER_CUSTOM_IMAGE_NAME'].value | [0]" -o tsv | cut -d'|' -f2)          
          echo "previous_image=${current_image}" >> "$GITHUB_OUTPUT"
          echo "Current image running: ${current_image}"
          
      - name: Point Web App at the GHCR image
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }} 
        run: |
          : "${DIGEST:?digest missing from build and push}"
          image="${REGISTRY}/${IMAGE_NAME@L}@${DIGEST}"
          az webapp config container set \
            --name "$WEBAPP_NAME" \
            --resource-group "$WEBAPP_RESOURCEGROUP" \
            --container-image-name "$image"
            
      - name: Restart Web App
        run: |
          az webapp restart \
            --name "$WEBAPP_NAME" \
            --resource-group "$WEBAPP_RESOURCEGROUP"     
            
      - name: Ensure correct image loaded
        id: verify
        env:
          EXPECTED_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          : "${EXPECTED_DIGEST:?digest missing from build and push}"
          configured_image=$(az webapp config show \
            --name "$WEBAPP_NAME" \
            --resource-group "$WEBAPP_RESOURCEGROUP" \
            --query linuxFxVersion -o tsv)
          echo "configured image: ${configured_image}"
          case "$configured_image" in
            *"${EXPECTED_DIGEST}"*) echo "Image matches digest" ;;
            *) echo "::error::App uses ${configured_image}, expected ${EXPECTED_DIGEST}"; exit 1 ;;
          esac

      - name: Smoke test
        id: smoke
        env:
          SITE_URL: https://david-baker.co.uk
        run: |
          for i in {1..10}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${SITE_URL}" || true)
            echo "attempt $i: HTTP ${code}"
            [ "${code}" = "200" ] && { echo "Healthy after ${i} attempt(s)"; exit 0; }
            sleep 10
          done
          echo "::error::Site did not return 200 after deploy (last code: ${code})"
          exit 1

      - name: Roll back
        id: rollback
        if: failure() && steps.smoke.outcome == 'failure' && steps.webapp_img.outputs.previous_image != '' 
        env:
          PREVIOUS_IMAGE: "${{ steps.webapp_img.outputs.previous_image }}"        
        run: |
          echo "::warning::Smoke test failed, reverting to ${PREVIOUS_IMAGE}"
          az webapp config container set \
            --name "$WEBAPP_NAME" \
            --resource-group "$WEBAPP_RESOURCEGROUP" \
            --container-image-name "$PREVIOUS_IMAGE"
          az webapp restart \
            --name "$WEBAPP_NAME" \
            --resource-group "$WEBAPP_RESOURCEGROUP"  
          exit 1

      - name: Deploy Summary
        if: always()
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          PREVIOUS_IMAGE: ${{ steps.webapp_img.outputs.previous_image }}
        run: |
          {
            echo "### Deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| App | \`${WEBAPP_NAME}\` |"
            echo "| Deployed |  \`${REGISTRY}/${IMAGE_NAME@L}@${DIGEST}\` |"
            echo "| Previous | \`${PREVIOUS_IMAGE:-none}\` |"
            echo "| Verify | ${{ steps.verify.outcome }} |"
            echo "| Smoke | ${{ steps.smoke.outcome }} |"
            echo "| Rolled back | ${{ steps.rollback.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
