# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Personal website - Build and deploy Python app to Azure Web App

on:
  push:
    branches:
      - main

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: v1.${{ github.sha }}
  
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: 
      contents: read
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: pytest    

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest    
    timeout-minutes: 10
    permissions:
      id-token: write 
      contents: read
      packages: write      
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.ref }}
      cancel-in-progress: false      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7        
  
      - name: Construct image reference
        id: img
        run: echo "ref=${REGISTRY}/${IMAGE_NAME@L}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.img.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        run: docker push ${{ steps.img.outputs.ref }}
  
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_GITHUB_OIDC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            
      - name: Point Web App at the GHCR image
        run: |
          az webapp config container set \
            --name ${{ secrets.PERSONAL_WEBSITE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.PERSONAL_WEBSITE_RG }} \
            --container-image-name "${{ steps.img.outputs.ref }}"
            
      - name: Restart Web App
        run: |
          az webapp restart \
            --name ${{ secrets.PERSONAL_WEBSITE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.PERSONAL_WEBSITE_RG }}     

      - name: Smoke test
        id: smoke
        env:
          SITE_URL: https://david-baker.co.uk/
        run: |
          for i in {1..10}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$SITE_URL" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && { echo "Healthy after $i attempt(s)"; exit 0; }
            sleep 10
          done
          echo "::error::Site did not return 200 after deploy (last code: $code)"
          exit 1
