# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Personal website - Build and deploy Python app to Azure Web App

on:
  push:
    branches:
      - main
  pull_request:   
  
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: v1.${{ github.sha }}
  WEBAPP_NAME: ${{ secrets.PERSONAL_WEBSITE_WEBAPP_NAME }}
  WEBAPP_RESOURCEGROUP: ${{ secrets.PERSONAL_WEBSITE_RG }} 
    
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: 
      contents: read
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: pytest    

  build-and-push:
    needs: test
    runs-on: ubuntu-latest    
    timeout-minutes: 10
    permissions:      
      contents: read
      packages: write      
    outputs:
      ref: ${{ steps.img.outputs.ref }} # will output to next job
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.ref }}
      cancel-in-progress: true      
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1        
  
      - name: Construct image reference
        id: img
        run: echo "ref=${REGISTRY}/${IMAGE_NAME@L}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.img.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        if: github.event_name != 'pull_request' # only push when deploying
        run: docker push ${{ steps.img.outputs.ref }}
        
  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest    
    timeout-minutes: 10
    permissions:      
      contents: read
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.ref }}
      cancel-in-progress: false      
    steps:
      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_GITHUB_OIDC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            
      - name: Point Web App at the GHCR image
        run: |
          az webapp config container set \
            --name $WEBAPP_NAME \
            --resource-group $WEBAPP_RESOURCEGROUP \
            --container-image-name "${{ needs.build-and-push.outputs.ref }}"
            
      - name: Restart Web App
        run: |
          az webapp restart \
            --name ${{ env.WEBAPP_NAME }} \
            --resource-group ${{ env.WEBAPP_RESOURCEGROUP }}     
            
      - name: Ensure correct image loaded
        run: |
          configured_image=$(az webapp config show \
            --name ${{ env.WEBAPP_NAME }} \
            --resource-group ${{ env.WEBAPP_RESOURCEGROUP }} \
            --query linuxFxVersion -o tsv)
          echo "configured image: $configured_image"
          case "$configured_image" in
            *"${{ github.sha }}"*) echo "Image matches commit" ;;
            *) echo "::error:: App uses $configured_image, expected ${{ github.sha }}"; exit 1 ;;
            esac

      - name: Smoke test
        id: smoke
        env:
          SITE_URL: https://david-baker.co.uk/
        run: |
          for i in {1..10}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$SITE_URL" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && { echo "Healthy after $i attempt(s)"; exit 0; }
            sleep 10
          done
          echo "::error::Site did not return 200 after deploy (last code: $code)"
          exit 1
